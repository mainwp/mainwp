# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit Configuration for MainWP Dashboard
# Optimized for MainWP security patterns and conventions
#
language: "en-US"
inheritance: true
tone_instructions: "Focus on WordPress security patterns and MainWP conventions. Accept Instance() singleton naming and 4-space indentation."

# Reviews configuration
reviews:
  profile: "chill"  # Reduces nitpicky feedback while maintaining security focus
  request_changes_workflow: true
  high_level_summary: true
  poem: false  # Keep reviews professional
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "Draft"
    base_branches:
      - "main"
      - "develop"

  # Path-based filtering
  path_filters:
    - "**"
    # Exclude vendored/third-party code
    - "!vendor/**"
    - "!libs/**"
    - "!assets/js/apexcharts/**"
    - "!assets/js/gridstack/**"
    - "!assets/js/dropzone/**"
    # Exclude generated/build artifacts
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"

  # Path-specific review instructions
  path_instructions:
    - path: "**"
      instructions: |
        Review MainWP Dashboard6 in mainwp/mainwp-6. Follow the runtime floors
        declared in readme.txt and composer.json and the repository's PHPCS rules.
        Preserve public hooks, routes, abilities, schemas, stored values, and
        Dashboard6-to-Child6 payloads. Trace affected callers and extension consumers.
        Distinguish default-branch and public-release compatibility from coordinated
        changes on a named PR or branch. Treat historical learnings as revision-specific
        context: verify the current implementation and tests before applying an exception.
        A past deferral or accepted tradeoff does not exempt newly introduced security
        or data-loss regressions. Do not infer runtime compatibility from source inspection.
    # Security-critical: Admin handlers
    - path: "class/class-mainwp-post-*-handler.php"
      instructions: |
        Trace each externally reachable POST/AJAX action through its registered
        handler and shared guards. Verify nonce validation, operation-specific
        capability/MainWP rights, and site access before returning protected data
        or mutating state. A check in a caller or shared handler can satisfy the
        requirement; identify a reachable bypass before reporting a missing check
        in a helper. Apply operation-specific authorization to disclosure actions
        as well as mutations.
        Check unslashing, input types and bounds, SQL values, and escaping for the
        actual output context. Assign severity from exploitability and impact.
        Follow existing singleton naming and four-space indentation.
        PHPCS suppressions document lint exceptions; they do not prove security safety.

    # Security-critical: Database operations
    - path: "class/class-mainwp-install.php"
      instructions: |
        [id: nosonar-no-ip-on-version-compare] `// NOSONAR - no ip.` on version_compare() lines targets SonarQube S1313 (dotted version strings misread as IPs); it is not a PHPCS suppression, has no sniff to name, and matches the file's sibling guards. Do not ask for it to be named or removed.
    - path: "class/class-mainwp-db*.php"
      instructions: |
        DATABASE SECURITY REVIEW:

        Use $wpdb->prepare() for dynamic SQL values and the existing table-name
        helpers for MainWP tables. Verify identifier allowlists separately from
        value placeholders. Static queries without external values do not require
        placeholders. Check IN-list types, placeholder counts, and empty-list handling.
        Trace the value's validation and prepared fragments through the complete query
        before alleging SQL injection; identify the unsafe value and reachable input.
        Assign severity from exploitability and impact. Check query failures and
        migration postconditions before advancing a schema marker or changing credentials.

        MainWP-specific patterns to ACCEPT (not violations):
        - The wp_options view builders in class-mainwp-db.php
          (get_option_view, get_wp_options_join, get_wp_options_view,
          get_option_view_by_join, get_option_view_by) splice option names
          as SQL identifiers (column and table aliases), which
          $wpdb->prepare() cannot bind. Every name first passes through
          filter_safe_option_names(), which drops anything outside
          ^[A-Za-z0-9_]+$. Do not flag these builders for missing
          prepare() or for concatenated option names.

    # Security-critical: Child site communication
    - path: "class/class-mainwp-connect*.php"
      instructions: |
        CHILD COMMUNICATION SECURITY:

        Trace authenticated operations through MainWP_Connect::fetch_url_authed()
        or fetch_urls_authed(), their signing code, and the matching Child6 dispatcher.
        Registration, monitoring, connection diagnostics, and lower-level transport
        have different contracts. Direct HTTP/cURL inside an existing transport is
        not by itself an authentication bypass. Report a concrete bypass of required
        signing, replay protection, site scope, origin checks, or TLS policy.
        Preserve per-site transport settings and response/error shapes. Validate Child
        responses before use and keep credentials redacted even in diagnostic logs.

    # REST API: Different auth model
    - path: "includes/rest-api/**"
      instructions: |
        REST API REVIEW CONTEXT:

        Trace the route namespace through MainWP_REST_Authentication and the
        registered permission_callback. MainWP supports multiple authentication
        paths; do not assume Bearer-only authentication or add browser AJAX nonces
        to machine API-key requests. Verify API-key read/write permissions, user
        capabilities, operation rights, and site scope for the operation reached.
        For WordPress cookie-authenticated routes, check the applicable REST nonce
        path. Validate input types before lossy sanitization, preserve output schemas
        and error codes, and distinguish per-item batch errors from transport errors.

    # Abilities API: Similar to REST
    - path: "includes/abilities/**"
      instructions: |
        ABILITIES API REVIEW CONTEXT:

        Abilities use WordPress authentication on their REST surface and may run
        through other registered executors. Trace the actual transport and permission
        callback, including MainWP_Abilities_Util's base, per-site, and operation-right
        wrappers. Authentication alone does not establish authorization to mutate a site.
        Do not require a Bearer token or a browser AJAX nonce for every ability call.
        Verify schemas, operation-specific rights, scoped-site filtering, confirmation
        requirements, stable result/error shapes, and relevant failure-path tests.

    # UI Pages: Output escaping focus
    - path: "pages/page-mainwp-*.php"
      instructions: |
        UI PAGE REVIEW:

        1. ALL displayed variables must use appropriate escaping:
           - esc_html() for text content
           - esc_attr() for HTML attributes
           - esc_url() for URLs (NOT esc_html!)
           - esc_js() for JavaScript strings
        2. Use add_query_arg() for URL construction, not string concatenation
        3. For translated HTML, preserve approved markup with an explicit allowlist;
           escape interpolated values for their context. Translation does not make HTML safe.

        Common mistake: Using esc_html() for URLs - should be esc_url().

    # Widgets: Same as pages
    - path: "widgets/widget-mainwp-*.php"
      instructions: |
        WIDGET REVIEW:

        Same rules as UI pages:
        1. Proper escaping for all output contexts
        2. esc_url() for URLs, esc_attr() for attributes, esc_html() for text
        3. add_query_arg() for URL construction

        Check for mixed escaping contexts in complex HTML output.

    # Cron jobs: Background processing
    - path: "cron/**"
      instructions: |
        CRON JOB REVIEW:

        Trace how the job is scheduled and how site scope is carried into execution.
        Background jobs may have no interactive user; do not add a capability check
        that prevents legitimate cron execution without tracing the authorization boundary.
        Validate scheduled data, preserve locks and bounded execution, and propagate
        failures through the job's state/error contract. Logging alone is not success.
        Prepare dynamic SQL values and verify migration postconditions.

    # Tests: Different standards
    - path: "tests/**"
      instructions: |
        TEST CODE REVIEW:

        1. Assertions must be meaningful - can actually fail
        2. Follow the suite's existing test-discovery conventions
        3. Security tests must verify both success AND failure paths
        4. Mock data is acceptable in tests only

        Do NOT apply production security rules to test fixtures.

  # Tool integrations
  tools:
    # Enable AST-based security rules
    ast-grep:
      essential_rules: true

    # PHP analysis tools (complement existing phpcs.xml)
    phpstan:
      enabled: true
    phpcs:
      enabled: true  # Uses existing phpcs.xml config
    phpmd:
      enabled: true

    # Security scanning
    gitleaks:
      enabled: true  # Detect exposed credentials

# Chat configuration
chat:
  auto_reply: true

# Knowledge base (if available)
knowledge_base:
  automatic_linking_mode: auto
  linked_repositories:
    - repository: mainwp/mainwp-child-6
      instructions: >-
        MainWP Child6 executes Dashboard6 remote operations. Trace changed command
        names, signatures, authentication and replay checks, payload fields,
        response/error shapes, and third-party adapter behavior against the relevant
        Dashboard6 caller and Child6 implementation. Identify version requirements
        and distinguish public-release compatibility from a coordinated named PR or
        branch. Use evidence from both repositories before reporting a contract
        mismatch; source inspection does not establish runtime compatibility.
  learnings:
    scope: local
  code_guidelines:
    enabled: true
